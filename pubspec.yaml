name: vehicle_chat_app
description: "Milo Drive Fleet Chat Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.6
  http: ^1.6.0
  encrypt: ^5.0.3
  crypto: ^3.0.8

  # Firebase push notifications & encrypted session persistence
  firebase_core: any
  firebase_messaging: any
  flutter_local_notifications: any
  flutter_secure_storage: any
  dio: ^5.11.1
  go_router: ^18.1.4
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/